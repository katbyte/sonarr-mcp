---
name: coverage
on:
  push:
    branches: ['main']
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - 'scripts/testenv.sh'
      - '.github/workflows/coverage.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # the badge is pushed to a branch, so only a run on main may write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish-coverage-badge.sh needs the remote refs to find or create
          # the orphan branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq openssl docker

      # unit tests alone report a fraction for tools/, because almost
      # everything real happens in the live suites: make cover runs every
      # suite, each against its own Sonarr, and merges them
      - name: Run every suite with coverage
        run: make cover

      - name: Summarise
        id: cov
        run: |
          pct=$(go tool cover -func=.coverage/coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"
          {
            echo "## coverage: ${pct}%"
            echo
            echo '```'
            go tool covdata percent -i="$(find .coverage -mindepth 1 -maxdepth 1 -type d | paste -sd, -)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.cov.outputs.pct }}
          # the checkout persists no credentials, so the push is given the
          # job's own token (the job asks for contents: write above)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/publish-coverage-badge.sh

      - name: Tear down
        if: always()
        run: |
          for s in integration acceptance; do
            SONARR_TEST_CONTAINER=sonarr-mcp-$s \
              SONARR_TEST_DATA="$HOME/.cache/sonarr-mcp/testenv/$s" scripts/testenv.sh down || true
          done
