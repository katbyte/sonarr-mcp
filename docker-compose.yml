# Default always-on deployment: runs the released image from ghcr.io and serves MCP over HTTP.
# To run a local build instead: make docker, then set image: sonarr-mcp (or add build: .).
# Secrets (SONARR_TOKEN, SONARR_AUTH_TOKEN) come from a gitignored .env next to this file,
# see .env.example. Then register it in Claude Code:
#   claude mcp add --transport http sonarr http://<host>:8080/mcp \
#     --header "Authorization: Bearer <SONARR_AUTH_TOKEN>"

networks:
  net:
    name: net

services:
  sonarr-mcp:
    image: ghcr.io/katbyte/sonarr-mcp:latest
    container_name: sonarr-mcp
    restart: always
    logging:
      options:
        max-size: 100m
        max-file: "1"
    networks:
      net:
    # no dns override: the container uses Docker's resolver, which forwards to
    # the host's, so a LAN name like nas in SONARR_SERVER resolves the way it
    # does on the host. Pinning a public resolver here would break exactly that
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - "TZ=America/Vancouver"
      - "SONARR_SERVER=http://nas:8989"
      - "SONARR_LISTEN=:8080"
      - "SONARR_LOG=INFO"
      # - "SONARR_TOOLSETS=curation"  # the audits and everything that fixes what they find; default core
      # - "SONARR_READ_ONLY=true"     # only register tools that never change Sonarr's state
      # - "SONARR_ENABLE_DELETE=true" # opt in to series_delete and file_delete
